<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FOLD TWIN · 折界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#07080a}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#d8dee6;-webkit-user-select:none;user-select:none;touch-action:manipulation;
}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#top{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px 5px;gap:10px;
}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{
  font-family:"Songti SC","STSong","Noto Serif SC",serif;
  font-size:17px;font-weight:600;letter-spacing:.3em;
  background:linear-gradient(92deg,#e8a85c,#8fd0dc 78%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand span{font-size:8px;letter-spacing:.36em;color:#5c6672;margin-top:3px}
.meta{display:flex;align-items:baseline;gap:8px;text-align:right}
.meta b{font-family:"Songti SC","STSong",serif;font-size:13px;letter-spacing:.1em;color:#c6d0da;white-space:nowrap}
.meta i{
  font-style:normal;font-size:10px;letter-spacing:.08em;color:#7f8b98;
  border:1px solid rgba(120,140,160,.28);border-radius:20px;padding:2px 8px;white-space:nowrap;
}
.meta i.hot{color:#e8a85c;border-color:rgba(232,168,92,.45)}
.meta i.cold{color:#8fd0dc;border-color:rgba(143,208,220,.45)}

#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

#deck{
  flex:0 0 auto;padding:6px 12px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:stretch;
}
#deck .stat{
  flex:0 0 auto;min-width:86px;border-radius:13px;
  border:1px solid rgba(120,140,160,.16);
  background:linear-gradient(180deg,rgba(26,31,38,.9),rgba(14,17,21,.9));
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:11px;letter-spacing:.1em;color:#7f8b98;
}
#deck .stat b{
  font-size:19px;font-weight:600;color:#e6edf4;font-variant-numeric:tabular-nums;
  font-family:"Songti SC","STSong",serif;
}
#deck .stat b.over{color:#e2603f}
#deck .stat s{text-decoration:none;color:#5f6a76}
#deck button{
  flex:1;height:46px;border-radius:13px;border:1px solid rgba(120,140,160,.18);
  background:linear-gradient(180deg,rgba(28,34,42,.92),rgba(15,18,23,.92));
  color:#b9c4d0;font-size:13px;letter-spacing:.14em;font-family:inherit;cursor:pointer;
  transition:transform .1s,background .15s;
}
#deck button:active{transform:scale(.965);background:rgba(38,46,56,.95)}
#deck button:disabled{opacity:.32}

/* ── 遮罩 ── */
#veil{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));
  background:radial-gradient(circle at 50% 44%,rgba(16,20,26,.86),rgba(4,5,7,.96));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:1;transition:opacity .28s;
}
#veil.hide{opacity:0;pointer-events:none}
.card{width:100%;max-width:420px;text-align:center;animation:pop .34s cubic-bezier(.2,1.2,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.kicker{font-size:9px;letter-spacing:.4em;color:#5f6a76;margin-bottom:12px}
.card h1{
  font-family:"Songti SC","STSong","Noto Serif SC",serif;
  font-size:36px;font-weight:600;letter-spacing:.16em;
}
.card h1 .w{color:#e8a85c;text-shadow:0 0 30px rgba(232,168,92,.35)}
.card h1 .c{color:#8fd0dc;text-shadow:0 0 30px rgba(143,208,220,.35)}
.sub{font-size:11.5px;letter-spacing:.16em;color:#7f8b98;margin-top:14px;line-height:2}
.rule{
  margin:20px 0 22px;padding:15px 16px;border-radius:14px;text-align:left;
  background:linear-gradient(180deg,rgba(24,30,38,.7),rgba(13,16,20,.7));
  border:1px solid rgba(120,140,160,.14);display:grid;gap:10px;
}
.rule>div{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline}
.rule b{font-size:10.5px;letter-spacing:.08em;color:#9fb0c0;font-weight:600}
.rule span{font-size:11.5px;line-height:1.8;color:#8b98a6}
.rule em{font-style:normal;color:#e8a85c}
.rule strong{color:#8fd0dc;font-weight:600}
.go{
  width:100%;height:52px;border-radius:15px;border:1px solid #c07a3a;
  background:linear-gradient(100deg,#c8813f,#b06a34 46%,#3f8a99);
  color:#fff6ea;font-family:inherit;font-size:15px;letter-spacing:.24em;font-weight:600;
  box-shadow:0 8px 26px rgba(200,129,63,.22);cursor:pointer;
}
.go:active{transform:scale(.98)}

.winbox{
  background:linear-gradient(180deg,rgba(26,32,40,.82),rgba(12,15,19,.82));
  border:1px solid rgba(120,140,160,.16);border-radius:20px;
  padding:24px 16px 20px;box-shadow:0 18px 50px rgba(0,0,0,.5);
}
.stars{display:flex;justify-content:center;gap:12px;margin:18px 0 4px}
.stars i{font-style:normal;font-size:34px;color:#2c333c;line-height:1}
.stars i.on{
  color:#f0c04a;text-shadow:0 0 22px rgba(240,192,74,.5),0 3px 10px rgba(0,0,0,.5);
  animation:stamp .38s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes stamp{from{transform:scale(2.1) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.res{font-size:12px;letter-spacing:.12em;color:#7f8b98;margin-top:10px}
.res b{color:#dfe7ef}
.row{display:flex;gap:9px;margin-top:20px}
.row button{
  flex:1;height:48px;border-radius:13px;font-family:inherit;font-size:13px;letter-spacing:.14em;
  border:1px solid rgba(120,140,160,.18);background:rgba(26,32,40,.8);color:#b9c4d0;cursor:pointer;
}
.row button.prime{
  background:linear-gradient(100deg,#c8813f,#3f8a99);border-color:#c89050;color:#fff6ea;font-weight:600;
}
.row button:active{transform:scale(.97)}

#list h2{font-family:"Songti SC","STSong",serif;font-size:21px;letter-spacing:.2em;color:#dfe7ef}
#list .tot{font-size:11px;letter-spacing:.14em;color:#5f6a76;margin-top:8px}
#list .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:18px 0 4px}
#list .cell{
  aspect-ratio:1;border-radius:11px;border:1px solid rgba(120,140,160,.16);
  background:rgba(22,27,34,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;font-size:14px;color:#b9c4d0;font-variant-numeric:tabular-nums;
  transition:transform .1s;
}
#list .cell:active{transform:scale(.94)}
#list .cell.cur{border-color:#c8813f;box-shadow:0 0 0 1px rgba(200,129,63,.45) inset;color:#ffdcc0}
#list .cell.lock{opacity:.45;color:#6b7682;border-style:dashed;border-color:rgba(120,140,160,.12)}
#list .cell s{font-size:7px;letter-spacing:.5px;color:#f0c04a;text-decoration:none;height:8px;line-height:8px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><b>折界</b><span>FOLD TWIN</span></div>
    <div class="meta">
      <b id="lvName">第 1 关 · 初折</b>
      <i id="parTxt">最优 4 步</i>
    </div>
  </header>

  <main id="stage"><canvas id="cv"></canvas></main>

  <footer id="deck">
    <div class="stat"><b id="stepN">0</b><s id="stepMax">/4</s></div>
    <button id="btnUndo">撤 销</button>
    <button id="btnReset">重 来</button>
    <button id="btnList">选 关</button>
  </footer>
</div>

<div id="veil"><div class="card" id="veilCard"></div></div>

<script>
"use strict";

/* ══════════════ 关卡（tools/gen.py 生成并经 BFS 校验） ══════════════
   . 地面   # 墙   x 深渊   ~ 冰面
   一次输入：两界同向各走一步；flip 关卡下界方向取反
   撞墙/出界 -> 原地不动，整步照常；踩空 -> 整步作废，步数仍 +1
   ══════════════════════════════════════════════════════════════ */
var LEVELS=[
{w:5,h:3,par:4,flip:0,n:"初折",a:[".....",".....","....."],b:[".....",".....","....."],sa:[0,2],sb:[0,0],ea:[4,2],eb:[4,0]},
{w:6,h:3,par:4,flip:0,n:"错位",a:["......",".x...x","......"],b:["....x.","......","......"],sa:[3,0],sb:[3,2],ea:[1,2],eb:[1,2]},
{w:6,h:3,par:5,flip:0,n:"隙",a:["......","......","..x..."],b:["......","......","xx...."],sa:[2,0],sb:[0,1],ea:[1,1],eb:[1,1]},
{w:6,h:4,par:6,flip:0,n:"双径",a:["......","......","x...#.","......"],b:["......","......",".....x","......"],sa:[5,0],sb:[0,2],ea:[2,1],eb:[1,3]},
{w:7,h:4,par:8,flip:0,n:"回廊",a:[".......",".......","..x..#.","......."],b:["x.#....",".......",".......",".....x."],sa:[1,1],sb:[6,2],ea:[1,0],eb:[1,1]},
{w:7,h:4,par:7,flip:0,n:"窄门",a:[".......",".x.....",".......","......x"],b:["....#..","..x....","x.....x","......."],sa:[4,0],sb:[1,2],ea:[0,3],eb:[0,3]},
{w:8,h:4,par:7,flip:0,n:"偏光",a:["........",".x....x.","........",".x......"],b:["x.......","........","........","........"],sa:[0,2],sb:[0,1],ea:[4,1],eb:[4,1]},
{w:8,h:4,par:8,flip:0,n:"断桥",a:[".......x",".#......","x....x..","..#....."],b:[".....x..","........","........","...x...."],sa:[7,2],sb:[0,0],ea:[2,1],eb:[0,1]},
{w:8,h:5,par:7,flip:0,n:"滑行",a:[".xx.....","........","...~....",".......x","~.....~."],b:["...~....","..~.....","x....x..","...x...x","........"],sa:[0,1],sb:[0,3],ea:[3,4],eb:[2,4]},
{w:9,h:5,par:8,flip:0,n:"浮冰",a:["~....xxx~",".....~.~.",".........",".........","..x.~~..."],b:["........x","...~x..x.",".........",".........","...x....."],sa:[6,2],sb:[3,0],ea:[8,4],eb:[3,3]},
{w:9,h:5,par:8,flip:0,n:"逆流",a:["....~....",".........",".~..~..~.",".....x~..",".~x......"],b:["...~..x..","..~...x..",".........","......x..","......x.x"],sa:[4,4],sb:[0,2],ea:[6,0],eb:[1,0]},
{w:10,h:4,par:9,flip:0,n:"绕行",a:[".....~x...","..........","..........","~....x...."],b:["#....~....",".~.x......","..x.~.~.x.",".xx..x...."],sa:[4,3],sb:[9,3],ea:[1,1],eb:[4,1]},
{w:10,h:5,par:8,flip:0,n:"分流",a:[".~......~~","..x....x..","....~....x",".x.~.#....","......~..."],b:[".xxx#.....","...~......","x.x.......","x.........","..~....#.."],sa:[7,0],sb:[9,0],ea:[5,4],eb:[6,4]},
{w:10,h:5,par:11,flip:0,n:"窄缝",a:[".x#...~...","..........","~xx.......",".x...x....","...~.~xx.."],b:["........x.",".~......x.","..........","..........",".........."],sa:[8,1],sb:[7,4],ea:[4,1],eb:[5,1]},
{w:11,h:5,par:9,flip:1,n:"反向",a:[".~.........","~x..~......",".~...~...~~",".....x..x..","x........xx"],b:[".~~...~~...",".x.....x~.x",".~x.....~x.",".....x.....","xx.~~.x...~"],sa:[3,4],sb:[0,3],ea:[7,4],eb:[3,0]},
{w:11,h:5,par:10,flip:1,n:"镜像",a:["......~....","........~..","#......x...","...........",".~~..x...xx"],b:["........~..","x.........x","..#.x..xx..","...xxx...~.","......x...x"],sa:[1,1],sb:[1,1],ea:[4,2],eb:[2,1]},
{w:11,h:5,par:12,flip:1,n:"交错",a:["..x...#x...","~..~..x....","~~...x.....","........~x.","..x.xx~..~."],b:["........x..",".~...#..~.~","x.......x..","~~....x.x..",".~..x.~x.x."],sa:[4,2],sb:[6,1],ea:[0,4],eb:[5,0]},
{w:11,h:5,par:10,flip:1,n:"合界",a:["...........","....x......","....x#.....","~......x.~.","#.........."],b:["...~.x.x...","..........~",".xx~.......","..x..x.x..x","...x..#...x"],sa:[7,0],sb:[5,2],ea:[9,0],eb:[4,4]}
];

/* ══════════════ 常量 ══════════════ */
var F=0, W=1, X=2, I=3;
var CHM = {'.':F, '#':W, 'x':X, '~':I};
var DIR = {U:[0,-1], D:[0,1], L:[-1,0], R:[1,0]};
var PAL = {
  a:{ acc:'#e8a85c', acc2:'#f6c98a', deep:'#3a2413', rgba:'232,168,92' },
  b:{ acc:'#8fd0dc', acc2:'#bde8f2', deep:'#12313a', rgba:'143,208,220' }
};

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var SW=0, SH=0, DPR=1;
var $ = function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOut(t){ return 1-Math.pow(1-t,3); }
function rrect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function hash(x,y){ var h=(x*73856093)^(y*19349663); return Math.abs(h%997)/997; }

/* ══════════════ 声音：每一步是「两个声音同时响」 ══════════════ */
var AC=null, master=null;
function audio(){
  if(!AC){
    var C = window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
    master = AC.createGain(); master.gain.value = .42;
    var comp = AC.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=4;
    master.connect(comp); comp.connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function blip(freq, dur, vol, type, delay){
  if(!audio()) return;
  var t0 = AC.currentTime + (delay||0);
  var o = AC.createOscillator(); o.type = type||'sine'; o.frequency.value = freq;
  var g = AC.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0006,t0+dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+.02);
}
function sfxStep(){       // 双音：上界一个、下界一个
  blip(660,.07,.075,'triangle',0);
  blip(990,.07,.06,'triangle',.018);
}
function sfxBlock(){ blip(180,.06,.05,'square',0); }
function sfxFall(){
  if(!audio()) return;
  var o = AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(420, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, AC.currentTime+.45);
  var g = AC.createGain();
  g.gain.setValueAtTime(.10, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0008, AC.currentTime+.45);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+.5);
}
function sfxWin(){
  blip(523,.5,.075,'sine',0); blip(784,.5,.06,'sine',.06);
  blip(1046,.6,.05,'sine',.12); blip(1318,.5,.035,'sine',.2);
}
function sfxTap(){ blip(1400,.04,.02,'square',0); }

/* ══════════════ 存档 ══════════════ */
var SAVE_KEY='foldtwin.v1';
var SAVE={unlocked:1, stars:{}};
function loadSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){ var o=JSON.parse(raw);
      if(o && typeof o.unlocked==='number'){
        SAVE.unlocked = clamp(o.unlocked|0,1,LEVELS.length);
        SAVE.stars = o.stars||{};
      }
    }
  }catch(e){}
}
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){} }

/* ══════════════ 状态 ══════════════ */
var G = {
  li:0, w:0, h:0, par:0, flip:0,
  ga:[], gb:[],
  a:{x:0,y:0}, b:{x:0,y:0},
  sa:null, sb:null, ea:{x:0,y:0}, eb:{x:0,y:0},
  steps:0, hist:[], won:false, locked:false,
  anim:null, fall:null, bump:null, winT:0, t:0, hint:0, winTok:0,
  held:null, holdT:0, holdN:0
};

function parseRows(rows){
  var g=[];
  for(var y=0;y<rows.length;y++){
    var r=[];
    for(var x=0;x<rows[y].length;x++) r.push(CHM[rows[y][x]]);
    g.push(r);
  }
  return g;
}

function loadLevel(i){
  i = clamp(i,0,LEVELS.length-1);
  var L = LEVELS[i];
  G.li=i; G.w=L.w; G.h=L.h; G.par=L.par; G.flip=L.flip;
  G.ga=parseRows(L.a); G.gb=parseRows(L.b);
  G.sa={x:L.sa[0], y:L.sa[1]}; G.sb={x:L.sb[0], y:L.sb[1]};
  G.a={x:L.sa[0], y:L.sa[1]}; G.b={x:L.sb[0], y:L.sb[1]};
  G.ea={x:L.ea[0], y:L.ea[1]}; G.eb={x:L.eb[0], y:L.eb[1]};
  G.steps=0; G.hist=[]; G.won=false; G.locked=false;
  G.anim=null; G.fall=null; G.bump=null; G.winT=0;
  G.hint = (i===0)?1:0;
  G.winTok++;
  syncHud();
}

/* ══════════════ 规则（与 tools/gen.py 逐字对应） ══════════════ */
function advance(grid, p, d){
  var w=G.w, h=G.h;
  var nx=p.x+d[0], ny=p.y+d[1];
  if(nx<0||ny<0||nx>=w||ny>=h) return {path:null, dead:false, target:{x:nx,y:ny}, oob:true};
  var c = grid[ny][nx];
  if(c===W) return {path:null, dead:false, target:{x:nx,y:ny}};
  if(c===X) return {path:null, dead:true, target:{x:nx,y:ny}};
  var x=nx, y=ny, path=[];
  for(var guard=0; guard<64; guard++){
    path.push({x:x,y:y});
    if(grid[y][x] !== I) break;
    nx = x+d[0]; ny = y+d[1];
    if(nx<0||ny<0||nx>=w||ny>=h) break;
    if(grid[ny][nx]===W || grid[ny][nx]===X) break;
    x=nx; y=ny;
  }
  return {path:path, dead:false, target:null};
}

function tryMove(dirName){
  if(G.won||G.locked||G.anim||G.fall) return false;
  var d = DIR[dirName];
  if(!d) return false;

  var ra = advance(G.ga, G.a, d);
  if(ra.dead){ doFall('a', ra.target, dirName); return false; }
  var db = G.flip ? [-d[0], -d[1]] : d;
  var rb = advance(G.gb, G.b, db);
  if(rb.dead){ doFall('b', rb.target, dirName); return false; }

  var movedA = !!ra.path, movedB = !!rb.path;
  if(!movedA && !movedB){
    // 两边都过不去：空操作，不计步，给一个轻撞反馈
    G.bump = {t:0, dir:d};
    sfxBlock();
    return false;
  }

  G.hist.push({a:{x:G.a.x,y:G.a.y}, b:{x:G.b.x,y:G.b.y}, steps:G.steps});
  var durA = movedA ? Math.min(420, 105*ra.path.length) : 0;
  var durB = movedB ? Math.min(420, 105*rb.path.length) : 0;
  G.anim = {
    t:0, dur:Math.max(durA,durB,90),
    a:{ from:{x:G.a.x,y:G.a.y}, path:ra.path || [], dur:durA },
    b:{ from:{x:G.b.x,y:G.b.y}, path:rb.path || [], dur:durB }
  };
  sfxStep();
  return true;
}

function doFall(side, target, dirName){
  G.steps++;
  G.fall = { t:0, side:side, target:target };
  G.bump = { t:0, dir:DIR[dirName], big:true };
  sfxFall();
  syncHud();
}

function finishAnim(){
  var A = G.anim;
  if(!A) return;
  if(A.a.path.length) G.a = {x:A.a.path[A.a.path.length-1].x, y:A.a.path[A.a.path.length-1].y};
  if(A.b.path.length) G.b = {x:A.b.path[A.b.path.length-1].x, y:A.b.path[A.b.path.length-1].y};
  G.anim = null;
  G.steps++;
  syncHud();
  checkWin();
}

function checkWin(){
  if(G.a.x===G.ea.x && G.a.y===G.ea.y && G.b.x===G.eb.x && G.b.y===G.eb.y){
    G.won = true; G.locked = true; G.winT = 0;
    sfxWin();
    var stars = G.steps<=G.par ? 3 : (G.steps<=G.par+3 ? 2 : 1);
    // 踩空次数影响：每踩空一次扣一档
    var key = String(G.li+1);
    var prev = SAVE.stars[key]||0;
    SAVE.stars[key] = Math.max(prev, stars);
    if(G.li+1 >= SAVE.unlocked) SAVE.unlocked = Math.min(LEVELS.length, G.li+2);
    writeSave();
    syncHud();
    var tok = ++G.winTok;
    setTimeout(function(){ if(tok===G.winTok) showWin(stars); }, 820);
  }
}

function undo(){
  if(!G.hist.length || G.anim || G.fall || G.locked) return;
  var s = G.hist.pop();
  G.a = {x:s.a.x, y:s.a.y}; G.b = {x:s.b.x, y:s.b.y};
  G.steps = s.steps; G.won = false;
  syncHud(); sfxTap();
}
function resetLevel(){
  if(G.anim||G.fall) return;
  loadLevel(G.li); sfxTap();
}

/* ══════════════ 几何 ══════════════ */
function geo(){
  var seam = clamp(SH*0.235, 118, 172);
  var padY = 8, padX = 10;
  var band = (SH - seam - padY*2)/2;
  var cs = Math.min((SW-padX*2)/G.w, (band-8)/G.h);
  cs = Math.max(8, cs*0.97);
  var pw = cs*G.w, ph = cs*G.h;
  var ax = (SW-pw)/2, ay = padY + (band-ph)/2;
  var by = padY + band + seam + (band-ph)/2;
  return { cs:cs, pw:pw, ph:ph, ax:ax, ay:ay, bx:ax, by:by,
           seamY: padY+band, seam:seam, band:band };
}
function dpadGeom(){
  var g = geo();
  var cx = SW/2, cy = g.seamY + g.seam/2;
  var r = clamp(g.seam*0.30, 30, 40);
  return { cx:cx, cy:cy, r:r, step:r+7, btn:Math.max(32, r*1.0) };
}

/* ══════════════ 绘制 ══════════════ */
function drawBg(){
  var g = ctx.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,'#0d0f13'); g.addColorStop(.5,'#090a0d'); g.addColorStop(1,'#07080a');
  ctx.fillStyle=g; ctx.fillRect(0,0,SW,SH);
  // 两界的氛围光
  var gg = geo();
  var warm = ctx.createRadialGradient(SW*.5, gg.ay+gg.ph*.5, 10, SW*.5, gg.ay+gg.ph*.5, Math.max(SW,gg.ph)*.78);
  warm.addColorStop(0,'rgba(232,168,92,.10)'); warm.addColorStop(1,'rgba(232,168,92,0)');
  ctx.fillStyle=warm; ctx.fillRect(0,0,SW,SH);
  var cool = ctx.createRadialGradient(SW*.5, gg.by+gg.ph*.5, 10, SW*.5, gg.by+gg.ph*.5, Math.max(SW,gg.ph)*.78);
  cool.addColorStop(0,'rgba(120,200,220,.09)'); cool.addColorStop(1,'rgba(120,200,220,0)');
  ctx.fillStyle=cool; ctx.fillRect(0,0,SW,SH);
}

function drawCell(type, x, y, cs, pal, gx, gy){
  var pad = Math.max(1, cs*0.045);
  var x0=x+pad, y0=y+pad, s=cs-pad*2, r=Math.max(2, cs*0.16);
  if(type===F){
    rrect(x0,y0,s,s,r);
    ctx.fillStyle='rgba('+pal.rgba+',.055)'; ctx.fill();
    ctx.strokeStyle='rgba('+pal.rgba+',.075)'; ctx.lineWidth=1; ctx.stroke();
  }else if(type===W){
    rrect(x0,y0,s,s,r);
    var g = ctx.createLinearGradient(0,y0,0,y0+s);
    g.addColorStop(0,'rgba(150,168,186,.30)');
    g.addColorStop(.5,'rgba(112,128,144,.24)');
    g.addColorStop(1,'rgba(60,72,84,.26)');
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba('+pal.rgba+',.16)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0+r*0.6, y0+1.5); ctx.lineTo(x0+s-r*0.6, y0+1.5);
    ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.stroke();
  }else if(type===X){
    rrect(x0,y0,s,s,r);
    ctx.fillStyle='#05060a'; ctx.fill();
    // 裂隙
    ctx.save();
    rrect(x0,y0,s,s,r); ctx.clip();
    ctx.strokeStyle='rgba('+pal.rgba+',.30)'; ctx.lineWidth=1;
    for(var e=0;e<5;e++){
      var hv = hash(gx*13+e*7, gy*17+e*3);
      var side = e%4, t0 = 0.16+hv*0.62, len = s*(0.10+hv*0.13);
      var px2, py2, qx2, qy2;
      if(side===0){ px2=x0+s*t0; py2=y0+1.5; qx2=px2; qy2=y0+1.5+len; }
      else if(side===1){ px2=x0+s*t0; py2=y0+s-1.5; qx2=px2; qy2=y0+s-1.5-len; }
      else if(side===2){ px2=x0+1.5; py2=y0+s*t0; qx2=x0+1.5+len; qy2=py2; }
      else { px2=x0+s-1.5; py2=y0+s*t0; qx2=x0+s-1.5-len; qy2=py2; }
      ctx.beginPath(); ctx.moveTo(px2,py2); ctx.lineTo(qx2,qy2); ctx.stroke();
    }
    var vg = ctx.createRadialGradient(x0+s/2,y0+s/2,s*0.1,x0+s/2,y0+s/2,s*0.72);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba('+pal.rgba+',.16)');
    ctx.fillStyle=vg; ctx.fillRect(x0,y0,s,s);
    ctx.restore();
    rrect(x0+.5,y0+.5,s-1,s-1,r);
    ctx.strokeStyle='rgba('+pal.rgba+',.5)'; ctx.lineWidth=1.2; ctx.stroke();
  }else if(type===I){
    rrect(x0,y0,s,s,r);
    ctx.fillStyle='rgba(190,222,246,.14)'; ctx.fill();
    ctx.save(); rrect(x0,y0,s,s,r); ctx.clip();
    ctx.strokeStyle='rgba(226,244,255,.20)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(x0+s*.1,y0+s*.82); ctx.lineTo(x0+s*.72,y0+s*.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0+s*.42,y0+s*.96); ctx.lineTo(x0+s*.96,y0+s*.38); ctx.stroke();
    ctx.restore();
    rrect(x0+.5,y0+.5,s-1,s-1,r);
    ctx.strokeStyle='rgba(206,236,252,.36)'; ctx.lineWidth=1; ctx.stroke();
  }
}

function drawExit(x, y, cs, pal, occupied, t){
  var cx=x+cs/2, cy=y+cs/2, R=cs*0.30;
  var pulse = occupied ? 1 : .55+.45*Math.sin(t*2.4);
  ctx.save();
  ctx.strokeStyle='rgba('+pal.rgba+','+(occupied?.95:.35+.35*pulse)+')';
  ctx.lineWidth = occupied ? 2.6 : 1.8;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,6.2832); ctx.stroke();
  if(occupied){
    var g = ctx.createRadialGradient(cx,cy,1,cx,cy,R*1.9);
    g.addColorStop(0,'rgba('+pal.rgba+',.55)');
    g.addColorStop(1,'rgba('+pal.rgba+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*1.9,0,6.2832); ctx.fill();
  }else{
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.arc(cx,cy,R*0.52,0,6.2832);
    ctx.strokeStyle='rgba('+pal.rgba+','+(.25+.2*pulse)+')'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawChar(x, y, cs, pal, t, squash){
  var cx=x+cs/2, cy=y+cs/2, r=cs*0.27;
  ctx.save();
  ctx.translate(cx,cy);
  if(squash && squash.k) ctx.scale(1+squash.k*0.16, 1-squash.k*0.16);
  ctx.shadowColor='rgba('+pal.rgba+',.85)'; ctx.shadowBlur=cs*0.5;
  var g = ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r*1.15);
  g.addColorStop(0, pal.acc2);
  g.addColorStop(.55, pal.acc);
  g.addColorStop(1, pal.deep);
  ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(0,0,r,0,6.2832);
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(-r*.3,-r*.34,r*.24,0,6.2832);
  ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fill();
  ctx.restore();
}

function drawPlate(which){
  var g = geo(), cs=g.cs;
  var ox = which==='a' ? g.ax : g.bx;
  var oy = which==='a' ? g.ay : g.by;
  var pal = which==='a' ? PAL.a : PAL.b;
  var grid = which==='a' ? G.ga : G.gb;
  var ex = which==='a' ? G.ea : G.eb;
  var occupied = which==='a' ? (G.a.x===G.ea.x&&G.a.y===G.ea.y) : (G.b.x===G.eb.x&&G.b.y===G.eb.y);

  // 底板
  ctx.save();
  rrect(ox-6, oy-6, g.pw+12, g.ph+12, 14);
  ctx.fillStyle = which==='a' ? 'rgba(24,20,16,.72)' : 'rgba(13,24,28,.72)';
  ctx.fill();
  ctx.strokeStyle = 'rgba('+pal.rgba+',.20)'; ctx.lineWidth = 1.4;
  if(which==='b' && G.flip){ ctx.setLineDash([5,4]); }
  ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  var x,y;
  for(y=0;y<G.h;y++) for(x=0;x<G.w;x++){
    drawCell(grid[y][x], ox+x*cs, oy+y*cs, cs, pal, x, y);
  }
  drawExit(ox+ex.x*cs, oy+ex.y*cs, cs, pal, occupied, G.t);

}

function charPos(which){
  var g = geo(), cs=g.cs;
  var ox = which==='a' ? g.ax : g.bx;
  var oy = which==='a' ? g.ay : g.by;
  var base = which==='a' ? G.a : G.b;
  var A = G.anim ? G.anim[which] : null;
  if(!A || !A.path.length) return { x: ox+base.x*cs, y: oy+base.y*cs };
  var k = clamp(G.anim.t * G.anim.dur / Math.max(90, A.dur), 0, 1) * A.path.length;
  var i = Math.min(A.path.length-1, Math.floor(k));
  var f = i===0 ? k : k-i;
  var from = i===0 ? A.from : A.path[i-1];
  var to = A.path[i];
  return { x: ox + lerp(from.x,to.x,f)*cs, y: oy + lerp(from.y,to.y,f)*cs };
}

function drawLink(){
  var pa = charPos('a'), pb = charPos('b'), cs = geo().cs;
  if(G.won) return;
  ctx.save();
  ctx.setLineDash([3,5]);
  ctx.strokeStyle = 'rgba(180,200,220,.13)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pa.x+cs/2, pa.y+cs/2);
  ctx.lineTo(pb.x+cs/2, pb.y+cs/2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawSeam(){
  var g = geo();
  var y0 = g.seamY, hh = g.seam;
  var grd = ctx.createLinearGradient(0,y0,0,y0+hh);
  grd.addColorStop(0,'rgba(232,168,92,0)');
  grd.addColorStop(.11,'rgba(232,168,92,.065)');
  grd.addColorStop(.34,'rgba(9,11,14,.97)');
  grd.addColorStop(.66,'rgba(9,11,14,.97)');
  grd.addColorStop(.89,'rgba(143,208,220,.065)');
  grd.addColorStop(1,'rgba(143,208,220,0)');
  ctx.fillStyle=grd; ctx.fillRect(0,y0,SW,hh);
  // 中线：一半暖一半冷
  var lg = ctx.createLinearGradient(0,0,SW,0);
  lg.addColorStop(0,'rgba(232,168,92,0)');
  lg.addColorStop(.28,'rgba(232,168,92,.55)');
  lg.addColorStop(.5,'rgba(220,225,235,.9)');
  lg.addColorStop(.72,'rgba(143,208,220,.55)');
  lg.addColorStop(1,'rgba(143,208,220,0)');
  ctx.fillStyle=lg;
  ctx.fillRect(0, y0+hh/2-0.5, SW, 1);
  // 折痕记号：上界标在中线之上、下界标在中线之下，用位置本身说明上下关系
  var mid = y0+hh/2;
  ctx.save();
  ctx.font='8.5px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(232,168,92,.52)';
  ctx.fillText('上界', 12, mid-7);
  ctx.textBaseline='top';
  if(G.flip){ ctx.fillStyle='rgba(143,208,220,.9)'; ctx.fillText('下界 ⇄ 反向', 12, mid+7); }
  else { ctx.fillStyle='rgba(143,208,220,.52)'; ctx.fillText('下界', 12, mid+7); }
  ctx.restore();
}

function drawDpad(){
  var d = dpadGeom();
  var active = G.held;
  // 背板
  ctx.save();
  var bg = ctx.createRadialGradient(d.cx,d.cy,d.btn*0.4,d.cx,d.cy,d.step+d.btn);
  bg.addColorStop(0,'rgba(20,25,31,.92)');
  bg.addColorStop(.7,'rgba(14,17,22,.72)');
  bg.addColorStop(1,'rgba(12,15,19,0)');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(d.cx,d.cy,d.step+d.btn*0.72,0,6.2832); ctx.fill();
  ctx.restore();

  var keys = [['U',0],['R',Math.PI/2],['D',Math.PI],['L',-Math.PI/2]];
  for(var i=0;i<keys.length;i++){
    var k = keys[i][0], ang = keys[i][1];
    var bx = d.cx + Math.sin(ang)*d.step;
    var by = d.cy - Math.cos(ang)*d.step;
    var on = active===k;
    var s = d.btn;
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(ang);
    if(on) ctx.scale(1.08,1.08);
    rrect(-s/2,-s/2,s,s,s*0.3);
    var g2 = ctx.createLinearGradient(0,-s/2,0,s/2);
    if(on){ g2.addColorStop(0,'rgba(232,168,92,.95)'); g2.addColorStop(1,'rgba(150,100,55,.95)'); }
    else { g2.addColorStop(0,'rgba(52,62,74,.92)'); g2.addColorStop(1,'rgba(28,34,42,.92)'); }
    ctx.fillStyle=g2; ctx.fill();
    ctx.strokeStyle = on ? 'rgba(255,220,180,.8)' : 'rgba(140,160,180,.22)';
    ctx.lineWidth=1.2; ctx.stroke();
    // 三角箭头
    var a2 = s*0.24;
    ctx.beginPath();
    ctx.moveTo(0,-a2*1.05); ctx.lineTo(a2*0.95,a2*0.62); ctx.lineTo(-a2*0.95,a2*0.62);
    ctx.closePath();
    ctx.fillStyle = on ? '#fff4e6' : 'rgba(196,210,226,.72)';
    ctx.fill();
    ctx.restore();
  }

  // 中央：两界符号
  ctx.save();
  ctx.beginPath(); ctx.arc(d.cx,d.cy,d.r*0.52,0,6.2832);
  ctx.fillStyle='rgba(16,20,25,.95)'; ctx.fill();
  ctx.strokeStyle='rgba(160,180,200,.22)'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(d.cx, d.cy-d.r*0.18, d.r*0.13,0,6.2832);
  ctx.fillStyle='rgba(232,168,92,.9)'; ctx.fill();
  ctx.beginPath(); ctx.arc(d.cx, d.cy+d.r*0.18, d.r*0.13,0,6.2832);
  ctx.fillStyle='rgba(143,208,220,.9)'; ctx.fill();
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,SW,SH);
  var shakeX=0, shakeY=0;
  if(G.bump){
    var amp = G.bump.big ? 5 : 2.2;
    var k = 1 - G.bump.t/0.28;
    if(k>0){ shakeX = Math.sin(G.bump.t*70)*amp*k; shakeY = Math.cos(G.bump.t*61)*amp*k*0.6; }
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBg();
  drawPlate('a');
  var pa = charPos('a');
  drawChar(pa.x, pa.y, geo().cs, PAL.a, G.t, squashFor('a'));
  drawLink();
  drawPlate('b');
  var pb = charPos('b');
  drawChar(pb.x, pb.y, geo().cs, PAL.b, G.t, squashFor('b'));
  drawSeam();
  drawDpad();

  // 踩空闪红
  if(G.fall){
    var f = G.fall, k2 = 1 - f.t/1.0;
    var g = geo();
    var ox = f.side==='a' ? g.ax : g.bx, oy = f.side==='a' ? g.ay : g.by;
    ctx.save();
    ctx.globalAlpha = clamp(1-f.t*1.4,0,1);
    ctx.beginPath();
    ctx.arc(ox+f.target.x*g.cs+g.cs/2, oy+f.target.y*g.cs+g.cs/2, g.cs*(0.3+f.t*0.8), 0, 6.2832);
    ctx.strokeStyle = 'rgba(230,80,60,.9)'; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.restore();
    // 边框红闪
    ctx.save();
    ctx.globalAlpha = clamp(1-f.t*1.6,0,1)*0.5;
    rrect(ox-6, oy-6, g.pw+12, g.ph+12, 14);
    ctx.strokeStyle='rgba(230,70,50,.9)'; ctx.lineWidth=2.6; ctx.stroke();
    ctx.restore();
  }

  // 过关光
  if(G.won){
    var g2 = geo(), k3 = clamp(G.winT*2,0,1);
    ctx.save();
    ctx.globalAlpha = k3*0.5;
    ctx.fillStyle = 'rgba(255,235,200,.10)';
    ctx.fillRect(0,0,SW,SH);
    ctx.restore();
  }

  // 首次提示：同步盘呼吸光环
  if(G.hint && G.steps===0 && !G.won){
    var d0 = dpadGeom();
    var ph = (G.t*0.9) % 1;
    ctx.save();
    ctx.globalAlpha = (1-ph)*0.5;
    ctx.strokeStyle = 'rgba(232,168,92,.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(d0.cx, d0.cy, d0.step + d0.btn*0.55 + ph*22, 0, 6.2832);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function squashFor(which){
  var A = G.anim ? G.anim[which] : null;
  if(!A || !A.path.length) return null;
  var p0 = A.from, p1 = A.path[0];
  var dx = p1.x-p0.x, dy = p1.y-p0.y;
  return { k:1, horizontal: Math.abs(dx) > Math.abs(dy) };
}

/* ══════════════ 主循环 ══════════════ */
var lastT = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastT) lastT = now;
  var dt = Math.min(60, now-lastT); lastT = now;
  G.t += dt/1000;

  if(G.anim){
    G.anim.t += dt / G.anim.dur;
    if(G.anim.t >= 1) finishAnim();
  }
  if(G.fall){
    G.fall.t += dt / 620;
    if(G.fall.t >= 1) G.fall = null;
  }
  if(G.bump){
    G.bump.t += dt/1000;
    if(G.bump.t > 0.3) G.bump = null;
  }
  if(G.won) G.winT += dt/1000;

  // 长按连发
  if(G.held){
    G.holdT += dt;
    var delay = G.holdN===0 ? 300 : 135;
    if(G.holdT > delay){
      G.holdT = 0; G.holdN++;
      tryMove(G.held);
    }
  }
  render();
}

/* ══════════════ 输入 ══════════════ */
function hitDir(x,y){
  var d = dpadGeom();
  var keys = [['U',0],['R',Math.PI/2],['D',Math.PI],['L',-Math.PI/2]];
  for(var i=0;i<keys.length;i++){
    var k=keys[i][0], ang=keys[i][1];
    var bx = d.cx + Math.sin(ang)*d.step;
    var by = d.cy - Math.cos(ang)*d.step;
    if(Math.abs(x-bx) <= d.btn*0.72 && Math.abs(y-by) <= d.btn*0.72) return k;
  }
  return null;
}

var swipe = null;
function toLocal(e){
  var r = cv.getBoundingClientRect();
  return { x:e.clientX-r.left, y:e.clientY-r.top };
}
cv.addEventListener('pointerdown', function(e){
  audio();
  var p = toLocal(e);
  var dir = hitDir(p.x,p.y);
  e.preventDefault();
  if(dir){
    G.held = dir; G.holdT = 0; G.holdN = 0;
    tryMove(dir);
    return;
  }
  swipe = { x:p.x, y:p.y, id:e.pointerId };
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
}, {passive:false});

cv.addEventListener('pointermove', function(e){
  if(!swipe) return;
  var p = toLocal(e);
  var dx = p.x-swipe.x, dy = p.y-swipe.y;
  if(Math.abs(dx)<26 && Math.abs(dy)<26) return;
  var dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?'R':'L') : (dy>0?'D':'U');
  swipe = null;
  tryMove(dir);
}, {passive:false});

function endPtr(){
  G.held = null; swipe = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
window.addEventListener('pointerup', endPtr);
window.addEventListener('keydown', function(e){
  var m = {ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];
  if(m){ e.preventDefault(); audio(); tryMove(m); }
});

/* ══════════════ HUD ══════════════ */
function syncHud(){
  var L = LEVELS[G.li];
  $('lvName').textContent = '第 ' + (G.li+1) + ' 关 · ' + L.n;
  var par = $('parTxt');
  par.textContent = '最优 ' + L.par + ' 步';
  par.className = L.flip ? 'cold' : 'hot';
  $('stepN').textContent = G.steps;
  $('stepN').className = G.steps > L.par ? 'over' : '';
  $('stepMax').textContent = '/' + L.par;
  $('btnUndo').disabled = !G.hist.length || G.locked;
  // 顶部徽标额外提示反向
  if(L.flip) par.textContent = '反向 · 最优 ' + L.par + ' 步';
}

/* ══════════════ 面板 ══════════════ */
var veil=$('veil'), card=$('veilCard');
function showVeil(html){ card.innerHTML=html; veil.classList.remove('hide'); }
function hideVeil(){ veil.classList.add('hide'); }

function showStart(){
  showVeil(''
  + '<div class="kicker">OPPO FIND N5 · 折叠专供</div>'
  + '<h1><span class="w">折</span><span class="c">界</span></h1>'
  + '<div class="sub">一次输入，两个世界同时移动<br>让两个角色一起站上各自的出口</div>'
  + '<div class="rule">'
  + '<div><b>操作</b><span>点铰链处的<em>同步盘</em>四个方向，或在画面上滑动。一次指令，上界下界各走一步。</span></div>'
  + '<div><b>撞墙</b><span>哪边过不去，哪边就<em>原地不动</em>，另边照常走。</span></div>'
  + '<div><b>深渊</b><span>任一边踩空，<strong>整步作废</strong>并计入步数——步数超标就拿不到三星。</span></div>'
  + '<div><b>冰面</b><span>踩上去会一直滑，撞墙或到深渊前才停。</span></div>'
  + '<div><b>反向</b><span>部分关卡下界左右颠倒：同一指令，两边朝相反方向走。</span></div>'
  + '</div>'
  + '<button class="go" id="btnGo">进 入 折 界</button>');
  $('btnGo').addEventListener('click', function(){ audio(); hideVeil(); G.t=0; });
}

function showWin(stars){
  var L = LEVELS[G.li];
  var next = G.li+1;
  showVeil(''
  + '<div class="winbox">'
  + '<div class="kicker">第 ' + (G.li+1) + ' 关 · ' + L.n + '</div>'
  + '<h1><span class="w">双</span><span class="c">至</span></h1>'
  + '<div class="stars">'
  + '<i class="' + (stars>=1?'on':'') + '">★</i>'
  + '<i class="' + (stars>=2?'on':'') + '">★</i>'
  + '<i class="' + (stars>=3?'on':'') + '">★</i>'
  + '</div>'
  + '<div class="res">用了 <b>' + G.steps + '</b> 步　·　最优 <b>' + L.par + '</b> 步'
  + (stars<3 ? '　·　再省 ' + (G.steps-L.par) + ' 步满星' : '　·　已达最优') + '</div>'
  + '</div>'
  + '<div class="row">'
  + (next<LEVELS.length ? '<button class="prime" id="bNext">下 一 关</button>'
                        : '<button class="prime" id="bAgain">再 玩 一 次</button>')
  + '<button id="bAgain2">重 走</button>'
  + '<button id="bList">选 关</button>'
  + '</div>');
  var bn=$('bNext'); if(bn) bn.addEventListener('click', function(){ hideVeil(); loadLevel(next); });
  var ba=$('bAgain'); if(ba) ba.addEventListener('click', function(){ hideVeil(); loadLevel(G.li); });
  $('bAgain2').addEventListener('click', function(){ hideVeil(); loadLevel(G.li); });
  $('bList').addEventListener('click', showList);
}

function showList(){
  var total=0, cells='';
  for(var i=0;i<LEVELS.length;i++){
    var key=String(i+1), st=SAVE.stars[key]||0;
    total += st;
    var locked = (i+1) > SAVE.unlocked;
    cells += '<div class="cell'+(locked?' lock':'')+(i===G.li?' cur':'')+'" data-i="'+i+'">'
      + '<span>'+(i+1)+'</span><s>'+(st?'★★★'.slice(0,st):'')+'</s></div>';
  }
  showVeil('<div id="list"><h2>选 关</h2>'
    + '<div class="tot">已得 ' + total + ' / ' + (LEVELS.length*3) + ' 星</div>'
    + '<div class="grid">' + cells + '</div>'
    + '<div class="row"><button class="prime" id="bClose">返 回</button></div></div>');
  $('bClose').addEventListener('click', function(){ hideVeil(); });
  card.querySelector('.grid').addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('.cell') : null;
    if(!el || el.classList.contains('lock')) return;
    hideVeil(); loadLevel(parseInt(el.getAttribute('data-i'),10));
  });
}

/* ══════════════ 尺寸 ══════════════ */
function resize(){
  var r = cv.parentNode.getBoundingClientRect();
  DPR = Math.min(2.5, window.devicePixelRatio||1);
  SW = Math.max(160, r.width); SH = Math.max(160, r.height);
  cv.width = Math.round(SW*DPR); cv.height = Math.round(SH*DPR);
  cv.style.width = SW+'px'; cv.style.height = SH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ══════════════ 启动 ══════════════ */
$('btnUndo').addEventListener('click', undo);
$('btnReset').addEventListener('click', resetLevel);
$('btnList').addEventListener('click', showList);
window.addEventListener('resize', function(){ resize(); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function boot(){
  loadSave(); resize();
  loadLevel(Math.min(SAVE.unlocked-1, LEVELS.length-1));
  showStart();
  requestAnimationFrame(loop);
}

if(location.hash === '#dev'){
  window.__FT = {
    state: function(){
      return { li:G.li, w:G.w, h:G.h, par:G.par, flip:G.flip,
               a:{x:G.a.x,y:G.a.y}, b:{x:G.b.x,y:G.b.y},
               ea:G.ea, eb:G.eb, steps:G.steps, won:G.won,
               anim:!!G.anim, fall:!!G.fall, hist:G.hist.length };
    },
    level: function(i){ hideVeil(); loadLevel(i); },
    move: function(d){ return tryMove(d); },
    moveNow: function(d){
      tryMove(d);
      var guard=0;
      while(G.anim && guard++<30){ G.anim.t=1; finishAnim(); }
      return window.__FT.state();
    },
    play: function(word){
      for(var i=0;i<word.length;i++) window.__FT.moveNow(word[i]);
      return window.__FT.state();
    },
    undo: undo, reset: resetLevel,
    dpad: function(){ var d=dpadGeom(); return {cx:d.cx, cy:d.cy, step:d.step, btn:d.btn}; },
    cellXY: function(which, gx, gy){
      var g=geo(), ox = which==='a'?g.ax:g.bx, oy = which==='a'?g.ay:g.by;
      var r = cv.getBoundingClientRect();
      return { x: r.left+ox+gx*g.cs+g.cs/2, y: r.top+oy+gy*g.cs+g.cs/2, cs:g.cs };
    },
    dirAt: function(d){
      var dp=dpadGeom(), ang={U:0,R:Math.PI/2,D:Math.PI,L:-Math.PI/2}[d];
      var r = cv.getBoundingClientRect();
      return { x: r.left+dp.cx+Math.sin(ang)*dp.step, y: r.top+dp.cy-Math.cos(ang)*dp.step };
    },
    ui: function(){
      return { lvName:$('lvName').textContent, par:$('parTxt').textContent,
               step:$('stepN').textContent, undoDisabled:$('btnUndo').disabled,
               veil:!veil.classList.contains('hide'), text:card.textContent.slice(0,140) };
    },
    levels: function(){ return LEVELS; }
  };
}

boot();
</script>
